name: Windows
on: [push, pull_request]
jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alle PowerShell-Skripte einlesen (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $fehler = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e) { Write-Host "FEHLER $($_.Name): $($e[0].Message)"; $fehler++ } else { Write-Host "ok $($_.Name)" }
          }
          exit $fehler
      - name: Wächter mit Probemeldung
        shell: powershell
        env:
          MR_TEST: "1"
        run: ./werkzeuge/waechter.ps1 -Probe
      - name: Lauf mit harmlosem Jobskript
        shell: powershell
        run: |
          Set-Content -Path "$env:RUNNER_TEMP\job.ps1" -Value 'Write-Output "hallo"' -Encoding UTF8
          ./werkzeuge/lauf.ps1 -Name ci-probe -Skript "$env:RUNNER_TEMP\job.ps1"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content betrieb/laufanzeige.md | Select-Object -Last 1
      - name: Aufgabe trocken bauen und als XML prüfen
        shell: powershell
        run: |
          $xml = ./werkzeuge/aufgabe-anlegen.ps1 -Name "\maschinenraum\ci" -Werte @{ NAME = 'ci'; JOBSKRIPT = "C:\Pfad mit Leerzeichen & Zeichen'\job.ps1"; ARBEITSORDNER = 'C:\arbeit'; STUNDE = '08'; MINUTE = '30'; HOME = $env:USERPROFILE } -Trocken | Out-String
          [xml]$xml | Out-Null
          Write-Host "XML gueltig"
